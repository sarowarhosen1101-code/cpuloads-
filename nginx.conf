server {
    listen 80;
    server_name localhost;

    # Serve the React / Vite static frontend assets
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # CRITICAL FIX: Reverse-proxy API calls to the Node.js Express Backend
    # (Replace 'backend-service' with your correct K8s service name or container hostname)
    location /api/ {
        proxy_pass http://backend-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings for long-lived queries or tasks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
